name: Engineering checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: python3 scripts/check.py frontend
      - name: Dependency advisories (independent of build result)
        if: ${{ !cancelled() }}
        run: python3 scripts/check.py audit-npm

  backend:
    # Match the observed Apple Silicon resolution. This is not a Linux/CUDA lock.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints/macos-arm64-py312.txt
      - name: Install the scoped resolution
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install pip==26.2.1
          backend/.venv/bin/python -m pip install --only-binary=:all: -r backend/requirements-dev.txt -c backend/constraints/macos-arm64-py312.txt
          backend/.venv/bin/python -m pip check
      - run: python3 scripts/check.py backend-foundation
      - name: Dependency advisories (independent of test result)
        if: ${{ !cancelled() }}
        run: python3 scripts/check.py audit-python

  known-application-defects:
    name: Known application defects
    # Approved temporary exception for unchanged regressions APP-01 and APP-02.
    # Runs independently of blocking jobs; pytest failure output is not suppressed.
    # Remediation must restore `backend` above and remove this job/partition.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints/macos-arm64-py312.txt
      - name: Install the scoped resolution
        run: |
          test "$(uname -m)" = arm64
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install pip==26.2.1
          backend/.venv/bin/python -m pip install --only-binary=:all: -r backend/requirements-dev.txt -c backend/constraints/macos-arm64-py312.txt
          backend/.venv/bin/python -m pip check
      - name: Execute APP-01 and APP-02 regressions without suppression
        run: python3 scripts/check.py known-application-defects

  safeguards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python3 scripts/install-gitleaks.py
      - run: python3 scripts/check.py static
      - run: python3 scripts/check.py gates
      - name: Scan history and current source
        if: ${{ !cancelled() }}
        run: python3 scripts/check.py secrets
